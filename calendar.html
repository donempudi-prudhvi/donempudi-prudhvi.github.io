<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Static Calendar</title>
    <style>
        :root {
            --primary-clr: #4a90e2;
            --bg-clr: #f4f7f6;
            --text-clr: #333;
            --white: #fff;
            --shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-clr);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calendar-card {
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--shadow);
            width: 350px;
            overflow: hidden;
        }

        /* Header Section */
        .calendar-header {
            background: var(--primary-clr);
            color: var(--white);
            padding: 20px;
            text-align: center;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .calendar-header p {
            margin: 5px 0 0;
            opacity: 0.8;
        }

        /* Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 10px;
        }

        .day-name {
            font-weight: bold;
            color: #888;
            font-size: 0.8rem;
            text-align: center;
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .day {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: var(--text-clr);
        }

        .day:hover:not(.empty) {
            background-color: #e1e9f4;
            color: var(--primary-clr);
        }

        .day.today {
            background-color: var(--primary-clr);
            color: white;
            font-weight: bold;
        }

        .day.empty {
            cursor: default;
        }

        .day.event::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff5e57;
            border-radius: 50%;
            transform: translateY(12px);
        }
    </style>
</head>
