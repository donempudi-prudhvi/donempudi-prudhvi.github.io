<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Calendar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            --accent: #6c5ce7;
            --event-dot: #ff7675;
            --text-main: #2d3436;
            --bg: #fdfbff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calendar-container {
            background: white;
            width: 400px;
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 25px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 { font-size: 1.2rem; margin: 0; color: var(--text-main); }

        .nav-btn {
            border: none;
            background: #f0f0f7;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-btn:hover { background: var(--accent); color: white; }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
        }

        .weekday {
            font-size: 0.7rem;
            font-weight: 600;
            color: #b2bec3;
            padding-bottom: 15px;
        }

        .date {
            height: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }

        .date:hover:not(.empty) { background: #f1f0ff; }

        .date.today {
            background: var(--accent);
            color: white;
            font-weight: 600;
        }

        /* The Event Dot */
        .event-marker {
            width: 5px;
            height: 5px;
            background: var(--event-dot);
            border-radius: 50%;
            position: absolute;
            bottom: 6px;
        }

        .today .event-marker { background: white; }

    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="header">
            <h2 id="monthTitle">Month Year</h2>
            <div>
                <button class="nav-btn" onclick="changeMonth(-1)">&#10094;</button>
                <button class="nav-btn" onclick="changeMonth(1)">&#10095;</button>
            </div>
        </div>

        <div class="grid" id="calendarGrid"></div>
    </div>

    <script>
        let currentDate = new Date();

        // Sample Event Data (Format: 'YYYY-MM-DD')
        const myEvents = {
            '2026-01-15': 'Doctor Appointment',
            '2026-01-20': 'Project Deadline',
            '2026-02-14': 'Valentine\'s Day'
        };

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthTitle = document.getElementById('monthTitle');
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthTitle.innerText = `${monthNames[month]} ${year}`;

            grid.innerHTML = '';
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(d => {
                grid.innerHTML += `<div class="weekday">${d}</div>`;
            });

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="date empty"></div>`;
            }

            for (let i = 1; i <= totalDays; i++) {
                // Construct date string to check for events
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const hasEvent = myEvents[dateKey] ? '<div class="event-marker"></div>' : '';
                
                const isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) ? 'today' : '';
                
                grid.innerHTML += `
                    <div class="date ${isToday}" title="${myEvents[dateKey] || ''}">
                        ${i}
                        ${hasEvent}
                    </div>`;
            }
        }

        function changeMonth(step) {
            currentDate.setMonth(currentDate.getMonth() + step);
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
