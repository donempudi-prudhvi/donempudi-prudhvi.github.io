<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Glass Calendar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            --accent: #7d5fff;
            --accent-light: #7d5fff1a;
            --text-main: #2d3436;
            --text-muted: #a0a0a0;
            --bg: #f8faff;
            --white: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-container {
            background: var(--white);
            width: 750px;
            height: 480px;
            display: flex;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.08);
        }

        /* Sidebar - Current Date Info */
        .sidebar {
            background: var(--accent);
            width: 35%;
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .sidebar .day-big { font-size: 5rem; font-weight: 600; line-height: 1; }
        .sidebar .month-big { font-size: 1.5rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 2px; }

        /* Main Calendar Section */
        .main-content {
            flex: 1;
            padding: 30px;
            background: white;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h2 { margin: 0; font-weight: 600; color: var(--text-main); }

        .nav-btn {
            background: var(--accent-light);
            border: none;
            color: var(--accent);
            width: 35px;
            height: 35px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-btn:hover { background: var(--accent); color: white; }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
