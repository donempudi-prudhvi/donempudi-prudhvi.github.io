
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OAuth2 Refresh Token Flow</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 2rem; max-width: 900px; margin: auto; }
    .card { border: 1px solid #e6e6e6; padding: 1.25rem; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    button { background: #0366d6; color: white; border: 0; padding: 0.6rem 1rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow: auto; }
    .muted { color: #6b7280; font-size: 0.95rem; }
    .loading-card {
    background-color: #fff;
    padding: 30px 50px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    text-align: center;}

    
    .loading-text {
        font-size: 1.2em;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
        .dot {
        display: inline-block;
        width: 0.2em;
        margin-left: 0.1em;
        opacity: 0;
        animation: pulse 1.5s infinite;
    }
    
    /* Delay the animation for each dot */
    .dot.one {
        animation-delay: 0s;
    }
    
    .dot.two {
        animation-delay: 0.3s;
    }
    
    .dot.three {
        animation-delay: 0.6s;
    }
    
    @keyframes pulse {
        0% {
            opacity: 0;
            transform: translateY(0px);
        }
        50% {
            opacity: 1;
            transform: translateY(-2px);
        }
        100% {
            opacity: 0;
            transform: translateY(0px);
        }
    }
  input[type="text"] {
  width: 200px; /* Set a specific width */
  padding: 10px; /* Add padding inside the input field */
  border: 1px solid #ccc; /* Define a border */
  border-radius: 5px; /* Round the corners */
  font-family: Arial, sans-serif; /* Set the font family */
  font-size: 16px; /* Set the font size */
  color: #333; /* Set the text color */
}
    
  </style>
</head>
<body>
<div class="card" >
    <h1>OAuth2 Refresh Token Flow</h1>
    
  <div class="loading-card" id="loading-card">
        <span class="loading-text">Loading
            <span class="dot one">.</span>
            <span class="dot two">.</span>
            <span class="dot three">.</span>
        </span>
  </div>
  <p id="json"></p>
  
  

    <div id="controls">
      <input type="text" id="refresh_token" name="refresh_token" required ></input>
      <button id="authorizeBtn" onclick="getAccessToken()">Get Access Token</button>
    </div>

  </div>

  <script>
    //show loading by default

    document.getElementById("loading-card").style = "display:none;";
    document.getElementById("controls").style = "display:block;";

   window.onload = function() {
   
   };

    var myDomain = "https://prudhvi-demo-org--developer.sandbox.my.salesforce.com";
    var clientId = "3MVG9D68eYs7112EIiIQ.W2PxF2vNPnsYGxnz0b_XTA26GSH.lcfDbpK73Qr706vUs3P2l_iyZMby9qb7bywh";
    var clientSecret = "470F543CCC15F073E4C1A1BB5A33F01EA8B3C386BADCA153EC607D510C5BCB11";
   
    function getAccessToken(refreshtoken){
           document.getElementById("loading-card").style = "display:block;";
           document.getElementById("controls").style = "display:none;";
           const refresh_token_element = document.getElementById("refresh_token");
           const refresh_token_value = refresh_token_element.value;
           var client = new XMLHttpRequest();
           client.open("POST", myDomain + "/services/oauth2/token?grant_type=refresh_token"+"&refresh_token="+refresh_token_value, true);
           client.setRequestHeader("Authorization", "Basic "+ btoa(clientId+":"+clientSecret));
           client.send();
           client.onreadystatechange = function() {
               if(this.readyState == 3) {
                   response = JSON.parse(client.response);
                   console.log(response);
                   document.getElementById("loading-card").style = "display:none;";
                   document.getElementById("json").textContent = JSON.stringify(response, undefined, 5);
               }
           }
        }
    
    
  
  </script>

</body>
</html>
