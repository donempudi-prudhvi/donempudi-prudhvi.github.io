<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Toggle Password</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }

        h2 { margin-bottom: 1.5rem; color: #333; }

        .input-group {
            margin: 8px 0;
            text-align: left;
        }

        /* --- Password Container for Positioning --- */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 10px;
            /* Extra padding on right to prevent text overlap with eye icon */
            padding-right: 40px; 
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* --- The Eye Icon Styling --- */
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2rem;
            user-select: none; /* Prevents highlighting the icon */
            color: #666;
        }
        
        .toggle-password:hover { color: #333; }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 1rem;
        }

        button:hover { background-color: #0056b3; }

        /* --- Callout Styling --- */
        .callout {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            display: none;
            text-align: left;
            border-left: 5px solid;
        }

        .callout.success {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border-left-color: #28a745;
        }

        .callout.error {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border-left-color: #dc3545;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login</h2>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Username">
        </div>

        <div class="input-group password-wrapper">
            <input type="password" id="password" placeholder="Password">
            <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
        </div>

        <button onclick="startLogin()">Sign In</button>

        <div id="loginCallout" class="callout">
            <span id="calloutMessage"></span>
        </div>
    </div>

    <script>

        // The actual code starts here 
        var clientId = "3MVG9D68eYs7112EIiIQ.W2PxF2vNPnsYGxnz0b_XTA26GSH.lcfDbpK73Qr706vUs3P2l_iyZMby9qb7bywh";
        var clientSecret = "470F543CCC15F073E4C1A1BB5A33F01EA8B3C386BADCA153EC607D510C5BCB11";
        var baseURL = "https://prudhvi-demo-org--developer.sandbox.my.site.com/testlwrvforcesite";
        var redirectURL = "https://prudhvi-demo-org--developer.sandbox.my.site.com/testlwrvforcesite/services/oauth2/echo"
              
        // Performs the code exchange
        function doCodeExchange(authorizeResponse) {
           //Perform Code Exchange
           //Get Access Token
           var client = new XMLHttpRequest();
           client.open("POST", authorizeResponse.sfdc_community_url + "/services/oauth2/token", true);
           client.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
           client.send("code=" + authorizeResponse.code + "&grant_type=authorization_code&client_id=" + clientId + "&redirect_uri=" + redirectURL);
           client.onreadystatechange = function() {
               if(this.readyState == 3) {
                   response = JSON.parse(client.response);
                   getUserInfo(response.access_token, response.sfdc_community_url)
               }
           }
        }
        
        // Gets User Info
        function getUserInfo(accessToken, userInfoBaseURL) {
           var client = new XMLHttpRequest();
           client.open("GET", userInfoBaseURL + "/services/oauth2/userinfo", true);
           client.setRequestHeader("Content-Type", "application/json");
           client.setRequestHeader("Authorization", "Bearer " + accessToken);
           client.send();
           client.onreadystatechange = function() {
               if(this.readyState == 3) {
                   response = JSON.parse(client.response);
                   response.access_token = accessToken;
                   document.getElementById("json").textContent = JSON.stringify(response, undefined, 2);
                   document.getElementById("results").style.display="block";
               }
           }
        }
        
        //Starts the Login Process
        function startLogin() {
           var username = document.getElementById('username').value; //headless.user@developer.org
           var password = document.getElementById('password').value; //Baddu@8464
          
           var encodedUNP = btoa(username + ':' + password);
           var client = new XMLHttpRequest();
          
           client.open("POST", baseURL + "/services/oauth2/authorize", true);
           client.setRequestHeader("Auth-Request-Type", "Named-User");
           client.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
           client.setRequestHeader("Authorization", "Basic " + encodedUNP);
           client.send("response_type=code_credentials&client_id=" + clientId + "&redirect_uri=" + redirectURL);
           client.onreadystatechange = function() {
               if(this.readyState == 3) {
                   response = JSON.parse(client.response);
                   if(response.error){
                        window.alert("something went wrong in authorisation");
                   }else{
                   doCodeExchange(response);
                   }
               }
           }
           return false;
        }    

        // Actual code ends here
        
        // --- Logic to Toggle Password Visibility ---
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text'; // Show text
                toggleIcon.textContent = '🔒'; // Change icon to indicate "hide" (optional)
            } else {
                passwordInput.type = 'password'; // Hide text
                toggleIcon.textContent = '👁️'; // Change icon back to eye
            }
        }

        // --- Logic for Login Callout ---
        function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const callout = document.getElementById('loginCallout');
            const message = document.getElementById('calloutMessage');

            callout.className = 'callout'; 

            if (user === "admin" && pass === "1234") {
                callout.classList.add('success');
                message.innerHTML = "<strong>Success!</strong> Redirecting to dashboard...";
            } else {
                callout.classList.add('error');
                if (user === "" || pass === "") {
                    message.innerHTML = "<strong>Error:</strong> Fields cannot be empty.";
                } else {
                    message.innerHTML = "<strong>Error:</strong> Invalid username or password.";
                }
            }
        }
    </script>
</body>
</html>
