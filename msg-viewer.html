<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive MSG Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/ykarpovich/msg.js@master/dist/msg.js"></script>
    <style>
        .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.3s ease; }
        .drop-zone.hover { border-color: #3b82f6; background-color: #eff6ff; }
        #email-body { min-height: 200px; border: 1px solid #e2e8f0; padding: 1rem; border-radius: 0.5rem; background: white; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div class="max-w-4xl mx-auto py-10 px-4">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800">MSG File Interpreter</h1>
            <p class="text-slate-500">Upload and view Outlook .msg files directly in your browser.</p>
        </header>

        <div id="drop-zone" class="drop-zone rounded-xl p-10 flex flex-col items-center justify-center bg-white cursor-pointer mb-8">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <p class="text-lg font-medium text-slate-700">Click to upload or drag & drop</p>
            <p class="text-sm text-slate-400">Outlook .msg files only</p>
            <input type="file" id="file-input" class="hidden" accept=".msg">
        </div>

        <div id="viewer" class="hidden space-y-4 animate-in fade-in duration-500">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100 bg-slate-50/50">
                    <div class="grid grid-cols-1 gap-3">
                        <div><span class="text-xs font-bold uppercase tracking-wider text-slate-400">Subject</span><div id="msg-subject" class="text-lg font-semibold"></div></div>
                        <div class="flex gap-8">
                            <div><span class="text-xs font-bold uppercase tracking-wider text-slate-400">From</span><div id="msg-from" class="text-sm"></div></div>
                            <div><span class="text-xs font-bold uppercase tracking-wider text-slate-400">Date</span><div id="msg-date" class="text-sm"></div></div>
                        </div>
                    </div>
                </div>
                
                <div class="p-6">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Message Body</span>
                    <div id="email-body" class="prose max-w-none"></div>
                </div>

                <div id="attachment-section" class="p-6 border-t border-slate-100 hidden">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Attachments</span>
                    <div id="attachments" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
            
            <button onclick="location.reload()" class="text-sm text-blue-600 hover:underline">Clear and upload another</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const viewer = document.getElementById('viewer');

        // Trigger file input
        dropZone.onclick = () => fileInput.click();

        // Handle Drag & Drop
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('hover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const msgReader = new MSGReader(data);
                    const fileData = msgReader.getFileData();

                    if (!fileData.error) {
                        displayMessage(fileData);
                    } else {
                        alert("Error parsing MSG file: " + fileData.error);
                    }
                } catch (err) {
                    console.error(err);
                    alert("Failed to parse file. Ensure it is a valid .msg file.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function displayMessage(data) {
            dropZone.classList.add('hidden');
            viewer.classList.remove('hidden');

            document.getElementById('msg-subject').innerText = data.subject || "(No Subject)";
            document.getElementById('msg-from').innerText = `${data.senderName || ''} <${data.senderEmail || ''}>`;
            document.getElementById('msg-date').innerText = data.headers ? parseDate(data.headers) : "Unknown Date";
            
            // Prefer HTML body if available, otherwise use plain text
            const bodyContainer = document.getElementById('email-body');
            if (data.bodyHTML) {
                bodyContainer.innerHTML = data.bodyHTML;
            } else {
                bodyContainer.innerText = data.body || "";
            }

            // Handle Attachments
            const attachContainer = document.getElementById('attachments');
            const attachSection = document.getElementById('attachment-section');
            if (data.attachments && data.attachments.length > 0) {
                attachSection.classList.remove('hidden');
                attachContainer.innerHTML = '';
                data.attachments.forEach(att => {
                    const btn = document.createElement('div');
                    btn.className = "bg-slate-100 px-3 py-1 rounded text-sm border border-slate-200 flex items-center gap-2";
                    btn.innerHTML = `<span>📎</span> ${att.fileName || 'Unnamed attachment'}`;
                    attachContainer.appendChild(btn);
                });
            }
        }

        function parseDate(headers) {
            const match = headers.match(/Date: (.*)/);
            return match ? match[1] : "N/A";
        }
    </script>
</body>
</html>
