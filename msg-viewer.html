<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MSG File Reader</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/CFB/1.2.2/cfb.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --border: #2a2a32;
      --accent: #7ee8a2;
      --accent2: #38bdf8;
      --muted: #555566;
      --text: #e8e8f0;
      --text-dim: #9999aa;
      --radius: 10px;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'IBM Plex Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      width: 100%;
      max-width: 800px;
      margin-bottom: 2.5rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.2rem;
    }

    header h1 {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 1.3rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    header span {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    .drop-zone {
      width: 100%;
      max-width: 800px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      background: var(--surface);
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: #1a1a20;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      filter: grayscale(0.3);
    }

    .drop-zone h2 {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    .drop-zone p {
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    #result {
      width: 100%;
      max-width: 800px;
      margin-top: 2rem;
      display: none;
      flex-direction: column;
      gap: 1px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .msg-field {
      display: grid;
      grid-template-columns: 130px 1fr;
      background: var(--surface);
    }

    .msg-field + .msg-field { border-top: 1px solid var(--border); }

    .field-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent2);
      padding: 0.75rem 1rem;
      background: #13131a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: flex-start;
      padding-top: 0.9rem;
    }

    .field-value {
      font-size: 0.88rem;
      padding: 0.75rem 1rem;
      color: var(--text);
      word-break: break-word;
      line-height: 1.5;
    }

    .field-value.mono {
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    .body-section {
      background: var(--surface);
      border-radius: 0 0 var(--radius) var(--radius);
    }

    .body-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.75rem 1rem 0;
      background: #13131a;
      border-top: 1px solid var(--border);
    }

    .body-content {
      padding: 1rem;
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 500px;
      overflow-y: auto;
    }

    .body-content::-webkit-scrollbar { width: 6px; }
    .body-content::-webkit-scrollbar-track { background: transparent; }
    .body-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .attachments-row {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.75rem 1rem;
    }

    .attach-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .attach-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .attach-chip {
      background: #1e1e28;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.7rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .attach-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #error-msg {
      display: none;
      width: 100%;
      max-width: 800px;
      margin-top: 1.5rem;
      padding: 1rem 1.2rem;
      background: #1f0e0e;
      border: 1px solid #5a1a1a;
      border-radius: var(--radius);
      color: #f87171;
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }

    footer {
      margin-top: 4rem;
      font-size: 0.72rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>

<header>
  <h1>msg-reader</h1>
  <span>// outlook .msg viewer — runs locally, no upload</span>
</header>

<div class="drop-zone" id="dropZone">
  <input type="file" id="fileInput" accept=".msg" />
  <div class="drop-icon">📨</div>
  <h2>Drop a .msg file here</h2>
  <p>or click to browse — file never leaves your browser</p>
</div>

<div id="error-msg"></div>
<div id="result"></div>

<footer>built with cfb.js · client-side only · no data sent anywhere</footer>

<script>
// ── PROPERTY ID MAP (subset of MAPI props) ──────────────────────────
const PROPS = {
  '0037': 'Subject',
  '0c1a': 'Sender Name',
  '0c1f': 'Sender Email',
  '0e04': 'To',
  '0e03': 'CC',
  '0e02': 'BCC',
  '0039': 'Date Sent',
  '003d': 'In-Reply-To',
  '1000': 'Body (Plain)',
  '1013': 'Body (HTML)',
  '0070': 'Conversation Topic',
  '0071': 'Conversation Index',
  '0064': 'Sent Representing Name',
  '0065': 'Sent Representing Email',
};

// ── HELPERS ─────────────────────────────────────────────────────────
function readUTF16LE(buffer) {
  const arr = new Uint8Array(buffer);
  let s = '';
  for (let i = 0; i + 1 < arr.length; i += 2) {
    const code = arr[i] | (arr[i+1] << 8);
    if (code === 0) break;
    s += String.fromCodePoint(code);
  }
  return s;
}

function readUTF8(buffer) {
  try { return new TextDecoder('utf-8').decode(new Uint8Array(buffer)); }
  catch { return '(decode error)'; }
}

function parseMsgDate(buffer) {
  // FILETIME = 100-nanosecond intervals since 1601-01-01
  const view = new DataView(buffer);
  const lo = view.getUint32(0, true);
  const hi = view.getUint32(4, true);
  const bigInt = (BigInt(hi) << 32n) | BigInt(lo >>> 0);
  const epochMs = Number(bigInt / 10000n) - 11644473600000;
  if (isNaN(epochMs) || epochMs < 0) return null;
  return new Date(epochMs).toLocaleString();
}

// ── CORE PARSER ─────────────────────────────────────────────────────
function parseMSG(arrayBuffer) {
  const cfb = CFB.read(arrayBuffer, { type: 'array' });

  const fields = {};
  const attachments = [];

  for (const entry of cfb.FileIndex) {
    const name = entry.name;

    // Named property stream for body/subject etc.
    const propMatch = name.match(/^__substg1\.0_([0-9A-Fa-f]{4})([0-9A-Fa-f]{4})$/);
    if (propMatch) {
      const propId = propMatch[1].toLowerCase();
      const typeCode = propMatch[2].toLowerCase();
      const data = entry.content ? entry.content.buffer || new Uint8Array(entry.content).buffer : null;
      if (!data || data.byteLength === 0) continue;

      let value = null;
      if (typeCode === '001f' || typeCode === '001e') {
        // PT_UNICODE or PT_STRING8
        value = typeCode === '001f' ? readUTF16LE(data) : readUTF8(data);
      } else if (typeCode === '0040') {
        value = parseMsgDate(data);
      } else if (typeCode === '0102') {
        value = `[binary, ${data.byteLength} bytes]`;
      }

      if (value !== null && PROPS[propId]) {
        fields[PROPS[propId]] = value;
      }
      continue;
    }

    // Attachments
    const attachDir = name.match(/^__attach_version1\.0_#([0-9A-F]+)$/i);
    if (attachDir) {
      attachments.push({ index: attachDir[1], filename: null, data: null, size: 0 });
    }

    // Attachment filename
    const attachName = name.match(/^__attach_version1\.0_#([0-9A-F]+)\/__substg1\.0_(3704|3707)001[Ff]/i);
    if (attachName) {
      const idx = attachName[1];
      const data = entry.content ? entry.content.buffer || new Uint8Array(entry.content).buffer : null;
      const fn = data ? readUTF16LE(data).trim() : '(unknown)';
      const a = attachments.find(x => x.index === idx) || { index: idx, filename: null, data: null, size: 0 };
      if (!attachments.includes(a)) attachments.push(a);
      if (!a.filename) a.filename = fn;
    }

    // Attachment data
    const attachData = name.match(/^__attach_version1\.0_#([0-9A-F]+)\/__substg1\.0_37010102/i);
    if (attachData) {
      const idx = attachData[1];
      const a = attachments.find(x => x.index === idx);
      if (a && entry.content) {
        a.data = entry.content;
        a.size = entry.content.length || entry.content.byteLength || 0;
      }
    }
  }

  return { fields, attachments };
}

// ── RENDER ───────────────────────────────────────────────────────────
function renderResult({ fields, attachments }) {
  const el = document.getElementById('result');
  el.innerHTML = '';
  el.style.display = 'flex';

  const ORDER = ['Subject','Sender Name','Sender Email','Sent Representing Name',
    'Sent Representing Email','To','CC','BCC','Date Sent','Conversation Topic'];

  for (const key of ORDER) {
    if (!fields[key]) continue;
    const row = document.createElement('div');
    row.className = 'msg-field';
    row.innerHTML = `<div class="field-label">${key}</div><div class="field-value">${escHtml(fields[key])}</div>`;
    el.appendChild(row);
  }

  // Body (prefer plain text)
  const body = fields['Body (Plain)'] || fields['Body (HTML)'] || '';
  if (body) {
    const isHTML = !fields['Body (Plain)'] && fields['Body (HTML)'];
    const section = document.createElement('div');
    section.className = 'body-section';
    section.innerHTML = `<div class="body-label">Body${isHTML ? ' (HTML)' : ''}</div>`;
    const content = document.createElement('div');
    content.className = 'body-content';
    if (isHTML) {
      // Render stripped text version of HTML body
      const tmp = document.createElement('div');
      tmp.innerHTML = body;
      content.textContent = tmp.innerText || tmp.textContent;
    } else {
      content.textContent = body;
    }
    section.appendChild(content);
    el.appendChild(section);
  }

  // Attachments
  const validAttach = attachments.filter(a => a.filename || a.data);
  if (validAttach.length) {
    const row = document.createElement('div');
    row.className = 'attachments-row';
    row.innerHTML = `<div class="attach-label">Attachments (${validAttach.length})</div>`;
    const list = document.createElement('div');
    list.className = 'attach-list';
    for (const a of validAttach) {
      const chip = document.createElement('div');
      chip.className = 'attach-chip';
      const name = a.filename || `attachment_${a.index}`;
      chip.textContent = `📎 ${name}${a.size ? ` (${(a.size/1024).toFixed(1)}KB)` : ''}`;
      if (a.data) {
        chip.title = 'Click to download';
        chip.addEventListener('click', () => {
          const blob = new Blob([new Uint8Array(a.data)]);
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = name;
          anchor.click();
          URL.revokeObjectURL(url);
        });
      }
      list.appendChild(chip);
    }
    row.appendChild(list);
    el.appendChild(row);
  }
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}

function clearError() {
  const el = document.getElementById('error-msg');
  el.style.display = 'none';
  el.textContent = '';
}

// ── FILE HANDLING ────────────────────────────────────────────────────
function handleFile(file) {
  clearError();
  document.getElementById('result').style.display = 'none';

  if (!file.name.toLowerCase().endsWith('.msg')) {
    showError('Please select a .msg file.');
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = parseMSG(e.target.result);
      renderResult(parsed);
    } catch (err) {
      showError('Could not parse this .msg file. (' + err.message + ')');
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', (e) => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
