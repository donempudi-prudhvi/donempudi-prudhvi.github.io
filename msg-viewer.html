<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSG File Interpreter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pivonaze/msg-reader@1.1.0/dist/MSGReader.js"></script>
    <style>
        .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.3s ease; }
        .drop-zone.hover { border-color: #3b82f6; background-color: #eff6ff; }
        #email-body { min-height: 200px; border: 1px solid #e2e8f0; padding: 1.5rem; border-radius: 0.5rem; background: white; overflow-x: auto; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div class="max-w-4xl mx-auto py-10 px-4">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800">MSG File Interpreter</h1>
            <p class="text-slate-500">Parsing happens entirely in your browser. No data is sent to a server.</p>
        </header>

        <div id="drop-zone" class="drop-zone rounded-xl p-10 flex flex-col items-center justify-center bg-white cursor-pointer mb-8">
            <div class="bg-blue-50 p-4 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>
            <p class="text-lg font-medium text-slate-700">Drop your .msg file here</p>
            <p class="text-sm text-slate-400">or click to browse</p>
            <input type="file" id="file-input" class="hidden" accept=".msg">
        </div>

        <div id="viewer" class="hidden space-y-4">
            <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
                <div class="p-6 border-b border-slate-100 bg-slate-50">
                    <div class="space-y-3">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Subject</span>
                            <div id="msg-subject" class="text-xl font-bold text-slate-800"></div>
                        </div>
                        <div class="flex flex-wrap gap-6">
                            <div>
                                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">From</span>
                                <div id="msg-from" class="text-sm font-medium text-slate-700"></div>
                            </div>
                            <div>
                                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">To</span>
                                <div id="msg-to" class="text-sm font-medium text-slate-700"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="p-6">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 block mb-3">Message Content</span>
                    <div id="email-body"></div>
                </div>

                <div id="attachment-section" class="p-6 border-t border-slate-100 bg-slate-50 hidden">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 block mb-3">Attachments</span>
                    <div id="attachments" class="flex flex-wrap gap-3"></div>
                </div>
            </div>
            
            <button onclick="location.reload()" class="w-full py-3 rounded-xl border border-slate-300 text-slate-600 font-medium hover:bg-slate-100 transition-colors">
                Reset and View Another File
            </button>
        </div>
    </div>

    <script>
        // Use window.MSGReader to ensure we are grabbing the global export
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('hover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    // Initialize the reader
                    const msgReader = new window.MSGReader(e.target.result);
                    const fileData = msgReader.getFileData();

                    if (fileData) {
                        displayMessage(fileData);
                    } else {
                        throw new Error("Could not extract data");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Error: Library not loaded or file corrupt. Check console.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function displayMessage(data) {
            document.getElementById('drop-zone').classList.add('hidden');
            document.getElementById('viewer').classList.remove('hidden');

            document.getElementById('msg-subject').textContent = data.subject || "(No Subject)";
            document.getElementById('msg-from').textContent = `${data.senderName || ''} <${data.senderEmail || ''}>`;
            
            // Map recipients
            const recipients = data.recipients ? data.recipients.map(r => r.name || r.email).join(', ') : "N/A";
            document.getElementById('msg-to').textContent = recipients;
            
            const bodyContainer = document.getElementById('email-body');
            // If HTML exists, use it, otherwise use plain text
            if (data.bodyHTML) {
                bodyContainer.innerHTML = data.bodyHTML;
            } else {
                bodyContainer.innerText = data.body || "No message content found.";
            }

            // Handle Attachments
            const attachContainer = document.getElementById('attachments');
            const attachSection = document.getElementById('attachment-section');
            if (data.attachments && data.attachments.length > 0) {
                attachSection.classList.remove('hidden');
                attachContainer.innerHTML = '';
                data.attachments.forEach(att => {
                    const el = document.createElement('div');
                    el.className = "bg-white px-4 py-2 rounded-lg shadow-sm border border-slate-200 flex items-center gap-2 text-sm text-slate-600";
                    el.innerHTML = `<span>📎</span> ${att.fileName || 'Attachment'}`;
                    attachContainer.appendChild(el);
                });
            }
        }
    </script>
</body>
</html>
