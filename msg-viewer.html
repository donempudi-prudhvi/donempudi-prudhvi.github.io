<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSG Viewer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@kenjiuno/msgreader@1.23.0/lib/MsgReader.js"></script>
    <style>
        .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.2s ease; }
        .drop-zone.hover { border-color: #3b82f6; background-color: #f8fafc; transform: scale(1.01); }
        #email-body-content { all: revert; } /* Reset tailwind for email content */
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-10 font-sans">

    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="p-8 bg-white border-b border-gray-100">
                <h1 class="text-2xl font-extrabold text-gray-800">MSG Interpreter</h1>
                <p class="text-gray-500 text-sm mt-1">Standalone offline-capable Outlook message viewer.</p>
            </div>

            <div id="drop-zone" class="m-8 drop-zone rounded-xl p-12 flex flex-col items-center justify-center cursor-pointer">
                <div class="w-16 h-16 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </div>
                <p class="text-gray-700 font-semibold text-lg">Select or Drag an .msg file</p>
                <p class="text-gray-400 text-sm mt-1">Everything stays in your browser</p>
                <input type="file" id="file-input" class="hidden" accept=".msg">
            </div>

            <div id="viewer" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="p-8 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-50 p-6 rounded-xl border border-gray-200">
                        <div class="col-span-2">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Subject</label>
                            <div id="out-subject" class="text-lg font-bold text-gray-900 leading-tight"></div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">From</label>
                            <div id="out-from" class="text-sm text-gray-700 truncate"></div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Recipients</label>
                            <div id="out-to" class="text-sm text-gray-700 truncate"></div>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-3">Message Body</label>
                        <div id="email-body-container" class="bg-white border border-gray-200 rounded-xl p-6 min-h-[300px] overflow-auto shadow-inner">
                            <div id="email-body-content"></div>
                        </div>
                    </div>

                    <div id="attach-area" class="hidden">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-3">Attachments</label>
                        <div id="attach-list" class="flex flex-wrap gap-3"></div>
                    </div>

                    <button onclick="location.reload()" class="w-full py-4 text-gray-500 hover:text-gray-800 text-sm font-medium transition-colors">
                        ← Close and Upload New File
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        // Logic to fix "MSGReader is not a constructor"
        function getMsgReader() {
            // Some CDNs put it in MsgReader, others in window.MsgReader, others in .default
            if (typeof MsgReader === 'function') return MsgReader;
            if (window.MsgReader && typeof window.MsgReader === 'function') return window.MsgReader;
            if (window.MsgReader && typeof window.MsgReader.default === 'function') return window.MsgReader.default;
            return null;
        }

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('hover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => {
            if (e.target.files.length) processFile(e.target.files[0]);
        };

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const Constructor = getMsgReader();
                    if (!Constructor) {
                        throw new Error("Library failed to load. Please check your internet connection.");
                    }

                    const msgReader = new Constructor(e.target.result);
                    const fileData = msgReader.getFileData();
                    renderUI(fileData);
                } catch (err) {
                    console.error(err);
                    alert("Error parsing file: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderUI(data) {
            document.getElementById('drop-zone').classList.add('hidden');
            document.getElementById('viewer').classList.remove('hidden');

            document.getElementById('out-subject').textContent = data.subject || "(No Subject)";
            document.getElementById('out-from').textContent = `${data.senderName || ''} <${data.senderEmail || ''}>`;
