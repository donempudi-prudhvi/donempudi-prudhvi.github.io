<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSG Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@pivonaze/msg-reader@1.1.0/dist/MSGReader.js"></script>

    <style>
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .drop-zone.active { border-color: #3b82f6; background-color: #f0f7ff; }
        #email-body-content { font-family: sans-serif; line-height: 1.6; }
        #email-body-content img { max-width: 100%; height: auto; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen p-6 font-sans">

    <div class="max-w-4xl mx-auto">
        <div id="lib-status" class="mb-4 text-center hidden">
            <span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold">
                ⚠️ Error: Parsing Library not loaded. Check connection.
            </span>
        </div>

        <div class="glass-card rounded-3xl shadow-2xl border border-white overflow-hidden">
            <div class="p-8 border-b border-slate-100 flex items-center justify-between bg-white">
                <div>
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight">MSG Interpreter</h1>
                    <p class="text-slate-500 text-sm">Secure, Private, Browser-side Analysis</p>
                </div>
                <div class="hidden sm:block text-right">
                    <span class="text-[10px] font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded uppercase">Local Mode</span>
                </div>
            </div>

            <div id="upload-box" class="p-12">
                <div id="drop-zone" class="border-3 border-dashed border-slate-200 rounded-2xl py-20 px-4 text-center hover:border-blue-400 hover:bg-slate-50 transition-all cursor-pointer group">
                    <input type="file" id="file-input" class="hidden" accept=".msg">
                    <div class="text-slate-300 group-hover:text-blue-500 transition-colors mb-4 flex justify-center">
                        <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    </div>
                    <h2 class="text-xl font-bold text-slate-700">Drop Outlook MSG file here</h2>
                    <p class="text-slate-400 mt-2">or click to browse your computer</p>
                </div>
            </div>

            <div id="viewer" class="hidden animate-in fade-in zoom-in-95 duration-300">
                <div class="p-8 space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 col-span-2">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Subject</p>
                            <h3 id="msg-subject" class="text-xl font-bold text-slate-800"></h3>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">From</p>
                            <p id="msg-from" class="text-sm font-medium text-slate-700"></p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Recipients</p>
                            <p id="msg-to" class="text-sm font-medium text-slate-700"></p>
                        </div>
                    </div>

                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-1">Message Content</p>
                        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-inner min-h-[300px]" id="email-body-content">
                        </div>
                    </div>

                    <div id="attach-section" class="hidden">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-1">Attachments</p>
                        <div id="attach-list" class="flex flex-wrap gap-2"></div>
                    </div>

                    <button onclick="location.reload()" class="w-full py-4 bg-slate-800 text-white rounded-xl font-bold hover:bg-black transition-colors shadow-lg">
                        Interpret Another File
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Use a safe check for the constructor
        function getConstructor() {
            return window.MSGReader || (window.exports && window.exports.MSGReader);
        }

        // Library availability check on load
        window.addEventListener('load', () => {
            if (!getConstructor()) {
                document.getElementById('lib-status').classList.remove('hidden');
            }
        });

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('active'); };
        dropZone.ondragleave = () => dropZone.classList.remove('active');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const Constructor = getConstructor();
                if (!Constructor) {
                    alert("Library not loaded yet. Please refresh or check internet.");
                    return;
                }

                try {
                    const msgReader = new Constructor(e.target.result);
                    const fileData = msgReader.getFileData();
                    if (!fileData) throw new Error("Could not parse data");
                    showViewer(fileData);
                } catch (err) {
                    console.error(err);
                    alert("Error parsing MSG file. It might be corrupt or an unsupported version.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function showViewer(data) {
            document.getElementById('upload-box').classList.add('hidden');
            document.getElementById('viewer').classList.remove('hidden');

            document.getElementById('msg-subject').textContent = data.subject || "(No Subject)";
            document.getElementById('msg-from').textContent = `${data.senderName || ''} <${data.senderEmail || ''}>`;
            
            const tos = data.recipients ? data.recipients.map(r => r.name || r.email).join(', ') : 'N/A';
            document.getElementById('msg-to').textContent = tos;

            const bodyContainer = document.getElementById('email-body-content');
            if (data.bodyHTML) {
                bodyContainer.innerHTML = data.bodyHTML;
            } else {
                bodyContainer.innerHTML = `<pre class="whitespace-pre-wrap text-sm">${data.body || "No content found."}</pre>`;
            }

            // Attachments logic
            if (data.attachments && data.attachments.length > 0) {
                const section = document.getElementById('attach-section');
                const list = document.getElementById('attach-list');
                section.classList.remove('hidden');
                list.innerHTML = '';
                data.attachments.forEach(att => {
                    const chip = document.createElement('div');
                    chip.className = "flex items-center gap-2 bg-slate-100 border border-slate-200 px-4 py-2 rounded-lg text-xs font-bold text-slate-600";
                    chip.innerHTML = `<span>📎</span> ${att.fileName || 'Attachment'}`;
                    list.appendChild(chip);
                });
            }
        }
    </script>
</body>
</html>
