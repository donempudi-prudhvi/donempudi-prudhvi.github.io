
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OAuth2 User Agent Flow</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 2rem; max-width: 900px; margin: auto; }
    .card { border: 1px solid #e6e6e6; padding: 1.25rem; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    button { background: #0366d6; color: white; border: 0; padding: 0.6rem 1rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow: auto; }
    .muted { color: #6b7280; font-size: 0.95rem; }
    .loading-card {
    background-color: #fff;
    padding: 30px 50px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    text-align: center;}

    
    .loading-text {
        font-size: 1.2em;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
        .dot {
        display: inline-block;
        width: 0.2em;
        margin-left: 0.1em;
        opacity: 0;
        animation: pulse 1.5s infinite;
    }
    
    /* Delay the animation for each dot */
    .dot.one {
        animation-delay: 0s;
    }
    
    .dot.two {
        animation-delay: 0.3s;
    }
    
    .dot.three {
        animation-delay: 0.6s;
    }
    
    @keyframes pulse {
        0% {
            opacity: 0;
            transform: translateY(0px);
        }
        50% {
            opacity: 1;
            transform: translateY(-2px);
        }
        100% {
            opacity: 0;
            transform: translateY(0px);
        }
    }
    select {
        padding: 10px;
        font-size: 16px;
        border: 2px solid #ddd;
        border-radius: 5px;
        width: 100%;
        margin-bottom: 15px;
        cursor: pointer;
        outline: none;
    }

    select:focus {
        border-color: #007BFF;
    }
    
  </style>
</head>
<body>
<div class="card" >
    <h1>OAuth2 User Agent Flow</h1>
    
  <div class="loading-card" id="loading-card">
        <span class="loading-text">Loading
            <span class="dot one">.</span>
            <span class="dot two">.</span>
            <span class="dot three">.</span>
        </span>
  </div>
  <p id="json" style="overflow-wrap:break-word;"></p>
  
  

    <div id="controls">
      <h2>Selecr Response Type</h2>
        
        <select id="responseType"> <!--You can also use the token id_token value, with the openid scope and a nonce parameter. -->
            <option value="" disabled selected>-- Choose an option --</option>
            <option value="token">Token</option>
            <option value="token id_token">ID Token</option> 
        </select>
      
      <button id="authorizeBtn" onclick="initateAuthorization()">Authorize</button>
    </div>

  </div>

  <script>
    

    document.getElementById("loading-card").style = "display:none;";
    document.getElementById("controls").style = "display:block;";

   window.onload = function() {
          

           
           if((window.location.href).includes('access_token')){
               
                     document.getElementById("loading-card").style = "display:none;";
                     document.getElementById("controls").style = "display:none;";
                     
                    const cleanString = (window.location.hash).startsWith('#') ? rawString.substring(1) : rawString;
                    const params = new URLSearchParams(cleanString);
                    const jsonObject = {};
                    params.forEach((value, key) => {
                        jsonObject[key] = value;
                    });
                    const prettyJson = JSON.stringify(jsonObject, null, 4);
                    document.getElementById('jsonDisplay').innerText = prettyJson;
                    document.getElementById("json").textContent = prettyJson;
            
           }else{
               
           }

             
        };

    var myDomain = "https://prudhvi-demo-org--developer.sandbox.my.salesforce.com";
    var clientId = "3MVG9D68eYs7112EIiIQ.W2PxF2vNPnsYGxnz0b_XTA26GSH.lcfDbpK73Qr706vUs3P2l_iyZMby9qb7bywh";
    var redirectURL = "https://donempudi-prudhvi.github.io/user-agent.html";


   function initateAuthorization(){
       

      const url = new URL("/services/oauth2/authorize", myDomain);
      
      url.searchParams.set("client_id", clientId);
      url.searchParams.set("redirect_uri", redirectURL);
      if(document.getElementById('responseType').value == 'token'){
         url.searchParams.set("response_type", "token");
      }
     if(document.getElementById('responseType').value == 'token id_token'){
         url.searchParams.set("response_type", "token id_token");
         url.searchParams.set("scope", "openid");
         url.searchParams.set("nonce", Date.now().toString(36) + Math.random().toString(36).substr(2));
      }
     
     
      //url.searchParams.set("scope", "refresh_token");
      
     window.location.href = url.toString();


   }


    
    
  
  </script>

</body>
</html>
